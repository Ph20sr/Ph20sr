name: Atualiza cards do perfil

on:
  schedule:
    - cron: '17 6 * * *' # todo dia, 03:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/cards.yml']

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/generate.mjs Ph20sr
        env:
          # Opcional: um token pessoal (secret CARDS_TOKEN) com read:user conta
          # também as contribuições privadas; sem ele, usa o token padrão.
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit se mudou
        run: |
          if git diff --quiet -- assets; then echo "Sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: atualiza cards do perfil"
          git push
